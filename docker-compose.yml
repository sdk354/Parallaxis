services:
  db:
    image: pgvector/pgvector:pg17
    container_name: parallaxis-db
    environment:
      POSTGRES_DB: parallaxis
      POSTGRES_USER: parallaxis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parallaxis}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parallaxis -d parallaxis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
